version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      biome:
        patterns:
          - "@biomejs/*"
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - "@biomejs/*"
          - "@types/react*"
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
